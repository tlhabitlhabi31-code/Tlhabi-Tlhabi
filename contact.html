
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Discover Lesotho</title>

    
    <link
        href="bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Discover Lesotho
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false"
                aria-label="Open navigation menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="services.html">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="contact.html">Contact</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    
    <header class="page-header text-center">
        <div class="container">

            

            <h1>Contact Us</h1>

            <p>
                Fill out the form below
            </p>

        </div>
    </header>


    
    <main>
        <section class="section-space">
            <div class="container">


                            <form id="contactForm">

                                
                                <div class="mb-3">
                                    <label for="fullName"
                                           class="form-label">
                                        Full Name *
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="fullName"
                                           name="fullName"
                                           placeholder="Enter your full name"
                                           minlength="2"
                                           maxlength="60"
                                           autocomplete="name"
                                           required>
                                </div>


                                <div class="mb-3">
                                    <label for="email"
                                           class="form-label">
                                        Email Address *
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="example@email.com"
                                           autocomplete="email"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="phone"
                                           class="form-label">
                                        Phone Number *
                                    </label>

                                    <input type="tel"
                                           class="form-control"
                                           id="phone"
                                           name="phone"
                                           placeholder="Enter your phone number"
                                           autocomplete="tel"
                                           pattern="[0-9+() -]{7,20}"
                                           title="Enter a valid phone number using digits, spaces, +, brackets or hyphens."
                                           required>
                                </div>


<div class="mb-3">
  <label for="gender" class="form-label">Gender *</label>
  <select class="form-control" id="gender" name="gender" required>
    <option value="" disabled selected>Choose your gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
    <option value="prefer-not">Prefer not to say</option>
  </select>
</div>


<div class="mb-3">
  <label for="password" class="form-label">Password *</label>
  <input type="password" class="form-control" id="password" name="password" 
         placeholder="Enter your password" minlength="8" required>
  <small class="form-text text-muted">Minimum 8 characters</small>
</div>


<div class="mb-3">
  <label for="confirmPassword" class="form-label">Confirm Password *</label>
  <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
         placeholder="Confirm your password" required>
  <small id="passwordError" class="text-danger" style="display:none;">Passwords do not match!</small>
</div>
                                

                                <button type="submit"
                                        class="btn btn-brand">
                                    Send Enquiry
                                </button>

                                <button type="reset"
                                        class="btn btn-outline-secondary ms-2">
                                    Clear Form
                                </button>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>


    
    <footer class="site-footer text-center">
        <div class="container">
            <p>Discover Lesotho — Explore the Mountain Kingdom.</p>
            <p>&copy; 2026 Discover Lesotho. All rights reserved.</p>
        </div>
    </footer>


    
    <script
        src="bootstrap.bundle.min.js">
    </script>

    
    <script src="script.js"></script>

    <script>
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirmPassword');
  const errorText = document.getElementById('passwordError');

  confirmPassword.addEventListener('input', function() {
    if (password.value !== confirmPassword.value) {
      errorText.style.display = 'block';
      confirmPassword.setCustomValidity("Passwords don't match");
    } else {
      errorText.style.display = 'none';
      confirmPassword.setCustomValidity('');
    }
  });
</script>

</body>
</html>
